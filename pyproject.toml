[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "score-dev-tools"
version = "0.1.0"
description = "Run the centrally selected S-CORE Python tools with uv"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
score-tool = "score_tools.cli:main"

[tool.setuptools]
package-dir = {"" = "tools"}
packages = ["score_tools"]

[tool.setuptools.package-data]
score_tools = ["python_tools.bzl"]
