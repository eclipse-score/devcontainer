name: Update Dependencies with Renovate

on:
  schedule:
    # Run at 2 AM UTC on Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.4
        with:
          configurationFile: .github/renovate.json5
        env:
          LOG_LEVEL: debug
          # Uses the default GITHUB_TOKEN unless overridden
          # For private repos or higher rate limits, use RENOVATE_TOKEN
