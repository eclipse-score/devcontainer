name: DevContainer Release & Validate & Publish
# This workflow creates a semantic version release when main changed since the last release tag. Then it checks that for releases, updates do not break stuff and publishes the released container.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      rebuild_tag:
        description: Existing release tag to rebuild, for example v1.11.1
        required: false
        type: string
permissions:
  contents: read # for checkout
jobs:
  # Check whether semantic-release would create a new release without creating it.
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.rebuild_tag == ''
    permissions:
      contents: write
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.run-semantic-release.outputs.release_needed }}
    container:
      image: mcr.microsoft.com/devcontainers/javascript-node:4-24
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # this should have been done by the checkout action, but it doesn't work in a container, see https://github.com/actions/checkout/issues/766
      - run: git config --global --add safe.directory "$PWD"
      # pinned version updated automatically by Dependabot.
      # details at https://semantic-release.gitbook.io/semantic-release/usage/installation#global-installation
      - name: npx semantic-release
        id: run-semantic-release
        run: |
          set -eux pipefail
          npx semantic-release@25.0.1 --dry-run >> /tmp/semantic-release.log 2>&1 || (cat /tmp/semantic-release.log && exit 1)
          cat /tmp/semantic-release.log
          if grep -q "The next release version is" /tmp/semantic-release.log; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Build, test, and push temporary commit-tagged images before releasing.
  build:
    needs: [prepare]
    if: needs.prepare.outputs.release_needed == 'true'
    strategy:
      matrix:
        os: [arm64, amd64]
        include:
          - os: amd64
            name: DevContainer (amd64)
            runner: ubuntu-24.04
          - os: arm64
            name: DevContainer (arm64)
            runner: ubuntu-24.04-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: eclipse-score/more-disk-space@v1
      - name: Checkout (GitHub)
        uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Use .devcontainer from THIS repo for building and testing
      - name: Check, Build, Test, Publish
        uses: devcontainers/ci@v0.3
        with:
          # The .devcontainer is never published as pre-built container.
          # We want to only use it for building and testing the actual container, which resides in src/s-core-devcontainer.
          push: never
          runCmd: |
            set -eux pipefail

            # Check
            pre-commit run --show-diff-on-failure --color=always --all-files || exit 1

            # Create builder for multi-arch builds
            ./scripts/create_builder.sh

            # Build
            ./scripts/build.sh --${{ matrix.os }} "sha-${{ github.sha }}"

            # Test
            ./scripts/test.sh

            # Publish
            # We do not use the push feature of devcontainers/ci here, since that would push the wrong container.
            # Instead, we use the publish script which pushes the correct container (residing in src/s-core-devcontainer).
            # manually login to ghcr.io for publishing
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            ./scripts/publish.sh --${{ matrix.os }} "sha-${{ github.sha }}"
  # Rebuild and republish an existing release selected through workflow_dispatch.
  rebuild:
    if: github.ref == 'refs/heads/main' && inputs.rebuild_tag != ''
    strategy:
      matrix:
        os: [arm64, amd64]
        include:
          - os: amd64
            name: Rebuild DevContainer (amd64)
            runner: ubuntu-24.04
          - os: arm64
            name: Rebuild DevContainer (arm64)
            runner: ubuntu-24.04-arm
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: eclipse-score/more-disk-space@v1
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rebuild_tag }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release tag
        env:
          REBUILD_TAG: ${{ inputs.rebuild_tag }}
        run: |
          if [[ ! "$REBUILD_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $REBUILD_TAG" >&2
            exit 1
          fi
      - name: Build, Test, Publish
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: |
            REBUILD_TAG=${{ inputs.rebuild_tag }}
          runCmd: |
            set -euxo pipefail
            ./scripts/create_builder.sh
            ./scripts/build.sh --${{ matrix.os }} "$REBUILD_TAG"
            ./scripts/test.sh
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            ./scripts/publish.sh --${{ matrix.os }} "$REBUILD_TAG"
  # Merge the architecture images for an existing rebuilt release.
  rebuild-merge:
    needs: [rebuild]
    if: github.ref == 'refs/heads/main' && inputs.rebuild_tag != ''
    name: Merge Rebuilt Labels
    runs-on: ubuntu-24.04
    outputs:
      rebuild_tag: ${{ steps.validate-release-tag.outputs.rebuild_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: eclipse-score/more-disk-space@v1
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rebuild_tag }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release tag
        id: validate-release-tag
        env:
          REBUILD_TAG: ${{ inputs.rebuild_tag }}
        run: |
          if [[ ! "$REBUILD_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $REBUILD_TAG" >&2
            exit 1
          fi
          echo "rebuild_tag=$REBUILD_TAG" >> "$GITHUB_OUTPUT"
      - name: Merge rebuilt labels
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: |
            REBUILD_TAG=${{ steps.validate-release-tag.outputs.rebuild_tag }}
          runCmd: |
            set -euxo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            latest_release_tag=$(git ls-remote --tags --refs origin 'v*' \
              | awk -F/ '$NF ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print $NF }' \
              | sort -V \
              | tail -n 1)
            if [[ "$REBUILD_TAG" == "$latest_release_tag" ]]; then
              ./scripts/merge.sh "$REBUILD_TAG" "latest"
            else
              ./scripts/merge.sh "$REBUILD_TAG"
            fi
  # Create the GitHub release only after all validation builds succeed.
  release:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    name: release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.run-semantic-release.outputs.tag_name }}
    container:
      image: mcr.microsoft.com/devcontainers/javascript-node:4-24
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: git config --global --add safe.directory "$PWD"
      - name: npx semantic-release
        id: run-semantic-release
        run: |
          set -eux pipefail
          npx semantic-release@25.0.1 >> /tmp/semantic-release.log 2>&1 || (cat /tmp/semantic-release.log && exit 1)
          cat /tmp/semantic-release.log
          tag_name=$(grep "Created tag" /tmp/semantic-release.log | sed -E 's/.*Created tag (.*)/\1/')
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Promote validated temporary images to the new release architecture tags.
  promote:
    needs: [release, build]
    if: needs.release.outputs.tag_name != ''
    name: Promote release images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote architecture images
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          SOURCE_TAG: sha-${{ github.sha }}
        run: |
          set -euxo pipefail
          for arch in amd64 arm64; do
            docker buildx imagetools create \
              --tag "ghcr.io/eclipse-score/devcontainer:${TAG_NAME}-${arch}" \
              "ghcr.io/eclipse-score/devcontainer:${SOURCE_TAG}-${arch}"
          done
  # Create the release and latest multi-architecture manifests.
  merge:
    name: Merge Labels
    needs: [promote, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: eclipse-score/more-disk-space@v1
      - name: Checkout (GitHub)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Use .devcontainer from THIS repo for building and testing
      - name: Merge
        uses: devcontainers/ci@v0.3
        with:
          # The .devcontainer is never published as pre-built container.
          # We want to only use it for building and testing the actual container, which resides in src/s-core-devcontainer.
          push: never
          runCmd: |
            set -eux pipefail

            # Merge
            # We do not use the push feature of devcontainers/ci here, since that would push the wrong container.
            # Instead, we use the publish script which pushes the correct container (residing in src/s-core-devcontainer).
            # manually login to ghcr.io for publishing
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            ./scripts/merge.sh "${{ needs.release.outputs.tag_name }}" "latest"
