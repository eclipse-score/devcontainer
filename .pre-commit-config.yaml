repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: devcontainer-lock.json
      - id: trailing-whitespace
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=50, --enforce-all] # increase or add git lfs if too strict
        exclude: ^MODULE\.bazel\.lock$
  - repo: local
    hooks:
      - id: bzlmod-tidy
        name: bazel mod tidy
        entry: bazelisk mod tidy
        language: system
        pass_filenames: false
      - id: bzlmod-lockfile
        name: bazel mod deps lockfile check
        entry: bazelisk mod deps --lockfile_mode=error
        language: system
        pass_filenames: false
      - id: yamlfmt
        name: yamlfmt
        entry: tools/run-tool yamlfmt
        language: system
        types: [yaml]
      - id: shellcheck
        name: shellcheck
        entry: tools/run-tool shellcheck
        language: system
        types: [shell]
      - id: ruff-format
        name: ruff format
        entry: tools/run-tool ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: tools/run-tool ruff check --fix
        language: system
        types: [python]
      - id: tool-documentation
        name: check tool documentation
        entry: python3 tools/internal/sync_readme.py --check
        language: system
        pass_filenames: false
        files: ^tools/(README\.md|internal/sync_readme\.py|lockfiles/.*\.lock\.json)$
  - repo: https://github.com/eclipse-score/tooling
    rev: 31ff8eee214e4e97ef8f5cb46e443273515b63ec
    hooks:
      - id: copyright
  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: a1bb792acda6fd0724936b4ebbdbc8eceb9c0459 # v6.2.0
    hooks:
      - id: reuse-lint-file
